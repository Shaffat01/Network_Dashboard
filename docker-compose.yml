version: "3.8"

services:
  network-dashboard:
    image: ${DOCKER_IMAGE:-shaffat01/network-dashboard:latest}
    container_name: network-dashboard
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5001}:5000"
    environment:
      - FLASK_ENV=production
      - TZ=Asia/Dhaka
      # SQLite path inside container
      - DB_PATH=/app/data/network_dashboard.db
      # Optional overrides (from .env)
      - SSH_USERNAME=${SSH_USERNAME:-admin}
      - SSH_PASSWORD=${SSH_PASSWORD:-admin123}
      - SNMP_COMMUNITY=${SNMP_COMMUNITY:-public}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    volumes:
      # Persistent SQLite DB
      - dashboard_data:/app/data
      # CSV uploads
      - dashboard_uploads:/app/uploads
    networks:
      - dashboard_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  dashboard_data:
  dashboard_uploads:

networks:
  dashboard_net:
    driver: bridge