version: '3.8'

services:
  # MySQL Database কন্টেইনার
  mysql-db:
    image: mysql:8.0
    container_name: network-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootPass@2024
      MYSQL_DATABASE: network_dashboard
      MYSQL_USER: netadmin
      MYSQL_PASSWORD: NetAdmin@2024
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - network-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootPass@2024"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Flask Web Application কন্টেইনার
  web-app:
    # Jenkins dynamic build tag থেকে ইমেজ নিবে, না থাকলে latest নিবে
    image: ${DOCKER_IMAGE:-shaffat01/network-dashboard:latest}
    container_name: network-dashboard-app
    restart: always
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=false
      - SECRET_KEY=network-dashboard-secret-key-2024
      - MYSQL_HOST=mysql-db
      - MYSQL_PORT=3306
      - MYSQL_USER=netadmin
      - MYSQL_PASSWORD=NetAdmin@2024
      - MYSQL_DB=network_dashboard
      - SNMP_COMMUNITY=public
      - SSH_USERNAME=admin
      - SSH_PASSWORD=admin123
    ports:
      - "5001:5000" # <--- আপনার পছন্দমতো ৫০০১ পোর্টে ম্যাপ করা হয়েছে
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - network-net
    volumes:
      - upload_data:/tmp/uploads

volumes:
  mysql_data:
    driver: local
  upload_data:
    driver: local

networks:
  network-net:
    driver: bridge