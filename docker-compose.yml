version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: network-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootPass@2024
      MYSQL_DATABASE: network_dashboard
      MYSQL_USER: netadmin
      MYSQL_PASSWORD: NetAdmin@2024
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - network-net

  web-app:
    image: ${DOCKER_IMAGE:-shaffat01/network-dashboard:latest}
    container_name: network-dashboard-app
    restart: always
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=false
      - SECRET_KEY=network-dashboard-secret-key-2024
      - MYSQL_HOST=mysql-db
      - MYSQL_PORT=3306
      - MYSQL_USER=netadmin
      - MYSQL_PASSWORD=NetAdmin@2024
      - MYSQL_DB=network_dashboard
      - SNMP_COMMUNITY=public
      - SSH_USERNAME=admin
      - SSH_PASSWORD=admin123
    ports:
      - "5001:5000"
    depends_on:
      - mysql-db
    networks:
      - network-net
    volumes:
      - upload_data:/tmp/uploads

volumes:
  mysql_data:
  upload_data:

networks:
  network-net:
    driver: bridge